seed: [1234]

data:
  dataset: clf
  params:
    csv_path: datasets/clf/fingerprints.csv
    val: 0.15
    grid_size: 3
    padding_ratio: 0.3
    class_pad: true
    reg_pad: true
    weighted_grid_labels: false
    missing_rssi: -110.0

    # Refuse an accidentally huge classification/regression head.
    # Surveyor x/y should be converted to calibrated local metres.
    max_grid_cells: 5000

    # Numerical safety for Multi-CEL target weighting.
    label_weight_epsilon: 0.000001

    # CLF live decoder: blend only nearby, plausible cell candidates.
    decoder_top_k: 3
    decoder_secondary_ratio: 0.35
    decoder_neighbor_radius_cells: 1.5

    # Initial live confidence gates. Tune after validation/calibration.
    decoder_min_confidence: 0.45
    decoder_min_margin: 0.08

    # Any CSV column beginning with imu_ is automatically appended
    # to the motion encoder input.
    motion_features: [steps, step_delta, heading_sin, heading_cos, distance_m]

models:
  - name: CLF-mCEL-SensorFusion
    type: mCEL_sensor_fusion

    encoders:
      wifi:
        layers: [256, 128]
        dropout: 0.25
        activation: relu
        input_noise: 0.018
        input_dropout: 0.05
        modality_dropout: 0.10
      ble:
        layers: [128, 64]
        dropout: 0.20
        activation: relu
        input_noise: 0.018
        input_dropout: 0.07
        modality_dropout: 0.15
      motion:
        layers: [64, 64]
        dropout: 0.15
        activation: relu
        input_noise: 0.025
        modality_dropout: 0.10

    fusion_layer_norm: true
    fusion:
      layers: [256, 256]
      dropout: 0.30
      activation: relu

    head:
      classification:
        layers: [256]
        dropout: 0.20
        activation: relu
      regression:
        layers: [256]
        dropout: 0.20
        activation: relu

    params:
      epochs: 100
      batch_size: 64
      lr: 0.0005
      verbose: 1

dir:
  base: exp/clf/mCEL-sensor-fusion/
  result_file: metrics.pickle
