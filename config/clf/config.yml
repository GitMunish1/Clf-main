seed: [1234]

data:
  dataset: clf
  params:
    csv_path: datasets/clf/fingerprints.csv
    val: 0.15
    grid_size: 3
    padding_ratio: 0.3
    class_pad: true
    reg_pad: true
    weighted_grid_labels: false
    missing_rssi: -110.0

    # Any CSV column beginning with imu_ is automatically appended
    # to the motion encoder input.
    motion_features: [steps, step_delta, heading_sin, heading_cos, distance_m]

models:
  - name: CLF-mCEL-SensorFusion
    type: mCEL_sensor_fusion

    encoders:
      wifi:
        layers: [256, 128]
        dropout: 0.25
        activation: relu
      ble:
        layers: [128, 64]
        dropout: 0.20
        activation: relu
      motion:
        layers: [64, 64]
        dropout: 0.15
        activation: relu

    fusion_layer_norm: true
    fusion:
      layers: [256, 256]
      dropout: 0.30
      activation: relu

    head:
      classification:
        layers: [256]
        dropout: 0.20
        activation: relu
      regression:
        layers: [256]
        dropout: 0.20
        activation: relu

    params:
      epochs: 100
      batch_size: 64
      lr: 0.0005
      verbose: 1

dir:
  base: exp/clf/mCEL-sensor-fusion/
  result_file: metrics.pickle
